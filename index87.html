<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="写真アップロード要素の見た目とコードを確認・コピーできる紹介ページです。">
  <title>写真アップロード要素の紹介</title>
  <style>
    @layer base, layout, uploader, controls, codeview, responsive;

    @layer base {
      :root {
        color-scheme: light;
        --page-bg: linear-gradient(180deg, #f6f9ff 0%, #eef4ff 48%, #f6f3ff 100%);
        --surface: rgba(255, 255, 255, 0.96);
        --text: #0f172a;
        --muted: #64748b;
        --line: rgba(148, 163, 184, 0.28);
        --accent: #7567dc;
        --accent-2: #d989b4;
        --shadow: 0 12px 32px rgba(15, 23, 42, 0.09);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--page-bg);
        background-attachment: fixed;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", "Hiragino Sans", "Meiryo", sans-serif;
        line-height: 1.6;
      }

      button,
      input {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }
    }

    @layer layout {
      .page {
        width: min(100% - 28px, 760px);
        margin: 0 auto;
        padding: 32px 0 56px;
      }

      .hero {
        margin-bottom: 18px;
        text-align: center;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(24px, 5vw, 34px);
        line-height: 1.25;
      }

      .hero p {
        margin: 10px auto 0;
        max-width: 620px;
        color: var(--muted);
        font-size: 14px;
      }

      .panel {
        margin-top: 16px;
        padding: 20px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .panel-title {
        margin: 0 0 12px;
        font-size: 15px;
      }

      .field-label {
        display: block;
        margin-bottom: 7px;
        color: #334155;
        font-size: 13px;
        font-weight: 800;
      }

      .class-input {
        width: 100%;
        min-height: 48px;
        padding: 11px 13px;
        border: 1px solid rgba(148, 163, 184, 0.34);
        border-radius: 13px;
        background: #fff;
        color: var(--text);
        outline: none;
      }

      .class-input:focus {
        border-color: #8c82df;
        box-shadow: 0 0 0 4px rgba(117, 103, 220, 0.13);
      }

      .note {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
    }

    @layer uploader {
      /* 紹介対象: 写真アップロード要素 */
      .photo-upload-card {
        padding: 20px;
        background: rgba(255, 255, 255, 0.97);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 24px;
        box-shadow: 0 8px 24px rgba(41, 50, 75, 0.07);
      }

      .photo-upload-zone {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        height: 220px;
        overflow: hidden;
        border: 1.5px dashed rgba(117, 103, 220, 0.28);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,247,253,0.98));
        cursor: pointer;
        transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
      }

      .photo-upload-zone:hover,
      .photo-upload-zone.is-dragging {
        border-color: rgba(117, 103, 220, 0.58);
        box-shadow: 0 12px 28px rgba(117, 103, 220, 0.10);
        transform: translateY(-1px);
      }

      .photo-upload-zone:focus-within {
        outline: 3px solid rgba(117, 103, 220, 0.18);
        outline-offset: 3px;
      }

      .photo-upload-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 22px;
        text-align: center;
        pointer-events: none;
      }

      .photo-upload-icon {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(117,103,220,0.12), rgba(217,137,180,0.16));
      }

      .photo-upload-icon svg {
        width: 25px;
        height: 25px;
        stroke: #6e65ad;
      }

      .photo-upload-copy {
        display: grid;
        gap: 5px;
        margin: 0;
        text-align: center;
      }

      .photo-upload-title {
        color: #182033;
        font-size: 16px;
        font-weight: 800;
        line-height: 1.35;
        letter-spacing: 0.01em;
      }

      .photo-upload-guide {
        color: #667085;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.55;
      }

      .photo-upload-meta {
        color: #98a2b3;
        font-size: 11px;
        font-weight: 500;
        line-height: 1.4;
      }

      .photo-upload-input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }

      .photo-upload-preview-wrap {
        position: relative;
        display: none;
        overflow: hidden;
        border-radius: 18px;
      }

      .photo-upload-preview-wrap.is-visible {
        display: block;
      }

      .photo-upload-preview {
        display: block;
        width: 100%;
        max-height: 420px;
        object-fit: contain;
        background: #f8fafc;
        border: 1px solid rgba(110, 145, 210, 0.16);
        border-radius: 18px;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      }

      .photo-upload-change {
        position: absolute;
        right: 12px;
        bottom: 12px;
        padding: 8px 12px;
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(34, 46, 66, 0.84), rgba(56, 69, 92, 0.90));
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        box-shadow: 0 6px 16px rgba(15,23,42,0.18);
        pointer-events: none;
      }
    }

    @layer controls {
      .copy-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .copy-button {
        min-height: 48px;
        padding: 12px 14px;
        border: 1px solid rgba(189, 210, 224, 0.95);
        border-radius: 14px;
        background: linear-gradient(135deg, #ffffff 0%, #edf4ff 100%);
        color: #243447;
        font-weight: 800;
        box-shadow: 0 6px 18px rgba(57, 95, 128, 0.08);
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
      }

      .copy-button:hover {
        transform: translateY(-1px);
        filter: brightness(1.02);
        box-shadow: 0 9px 22px rgba(57, 95, 128, 0.12);
      }

      .copy-button:active {
        transform: scale(0.985);
        filter: brightness(0.98);
      }

      .copy-button.is-done {
        border-color: rgba(16, 185, 129, 0.35);
        background: linear-gradient(135deg, #ffffff 0%, #ecfdf5 100%);
        color: #047857;
      }

      .status {
        min-height: 24px;
        margin: 10px 0 0;
        color: #475569;
        font-size: 13px;
        text-align: center;
      }
    }

    @layer codeview {
      .full-code-wrap {
        margin-top: 18px;
      }

      .full-code-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 0 0 8px;
        color: #334155;
        font-size: 13px;
        font-weight: 800;
      }

      .full-code {
        width: 100%;
        min-height: 360px;
        resize: vertical;
        padding: 15px;
        border: 1px solid rgba(148, 163, 184, 0.30);
        border-radius: 14px;
        background: #0f172a;
        color: #e2e8f0;
        font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        tab-size: 2;
        white-space: pre;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        outline: none;
      }

      .full-code:focus {
        border-color: #8c82df;
        box-shadow: 0 0 0 4px rgba(117, 103, 220, 0.13);
      }
    }

    @layer responsive {
      @media (max-width: 560px) {
        .page {
          width: min(100% - 20px, 760px);
          padding-top: 20px;
        }

        .panel,
        .photo-upload-card {
          padding: 16px;
          border-radius: 18px;
        }

        .photo-upload-zone {
          height: 190px;
          border-radius: 18px;
        }

        .copy-grid {
          grid-template-columns: 1fr;
        }
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>写真アップロード要素</h1>
      <p>クラス名を変更し、CSS・HTML・JavaScriptを個別にコピーできます。ズボラ版は1つの要素を貼るだけで動作します。</p>
    </header>

    <section class="panel" aria-labelledby="classTitle">
      <h2 id="classTitle" class="panel-title">クラス名</h2>
      <label class="field-label" for="classNameInput">先頭クラス名</label>
      <input id="classNameInput" class="class-input" type="text" value="uni-photo-dropbox" autocomplete="off" spellcheck="false">
      <p class="note">英数字・ハイフン・アンダースコアが使用できます。コピー内容へ即時反映されます。</p>
    </section>

    <section class="panel" aria-labelledby="textTitle">
      <h2 id="textTitle" class="panel-title">案内文</h2>
      <label class="field-label" for="uploadTitleInput">1行目</label>
      <input id="uploadTitleInput" class="class-input" type="text" value="写真をアップロード" autocomplete="off">
      <label class="field-label" for="uploadGuideInput" style="margin-top:12px">2行目</label>
      <input id="uploadGuideInput" class="class-input" type="text" value="クリックして選択、またはここへドラッグ" autocomplete="off">
      <label class="field-label" for="uploadMetaInput" style="margin-top:12px">3行目</label>
      <input id="uploadMetaInput" class="class-input" type="text" value="JPG・PNG・WebPに対応" autocomplete="off">
      <p class="note">変更内容は表示例とコピーコードへ即時反映され、IndexedDBへ自動保存されます。</p>
    </section>

    <section class="panel" aria-labelledby="previewTitle">
      <h2 id="previewTitle" class="panel-title">表示例</h2>
      <div id="demoMount"></div>
    </section>

    <section class="panel" aria-labelledby="copyTitle">
      <h2 id="copyTitle" class="panel-title">コードをコピー</h2>
      <div class="copy-grid">
        <button class="copy-button" type="button" data-copy="css">CSSをコピー</button>
        <button class="copy-button" type="button" data-copy="html">要素をコピー</button>
        <button class="copy-button" type="button" data-copy="js">JavaScriptをコピー</button>
        <button class="copy-button" type="button" data-copy="lazy">ズボラ版要素をコピー</button>
      </div>
      <div class="full-code-wrap">
        <label class="full-code-label" for="fullCodeOutput">全体コード</label>
        <textarea id="fullCodeOutput" class="full-code" readonly spellcheck="false" aria-label="CSS・要素・JavaScriptをまとめた全体コード"></textarea>
      </div>
      <p id="copyStatus" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>

/*

ライセンスについて

本サイトのソースコードは、MITライセンスのもとで公開しています。

本サイトの「CSSをコピー」「要素をコピー」「JavaScriptをコピー」「ズボラ版要素をコピー」ボタンによって出力されるコードには、本サイトのMITライセンスを適用しません。

これらのボタンによって出力されたコードは、著作権表示やライセンス表示を付けることなく、個人・法人を問わず、自由に使用、複製、改変、公開、配布および商用利用できます。

ただし、出力されたコードに第三者が権利を有する素材、ライブラリまたはコードが含まれる場合は、それぞれの権利およびライセンス条件が優先して適用されます。

なお、この許諾は各ボタンによって出力されたコードのみに適用されます。本サイトのデザイン、文章、画像、プログラムその他の構成要素に関する著作権を放棄するものではありません。

本サイト自体のソースコードを複製、改変または再配布する場合は、著作権表示およびMITライセンスの全文を含めるなど、MITライセンスの条件を遵守してください。

*/
    
    (() => {
      const classInput = document.getElementById('classNameInput');
      const uploadTitleInput = document.getElementById('uploadTitleInput');
      const uploadGuideInput = document.getElementById('uploadGuideInput');
      const uploadMetaInput = document.getElementById('uploadMetaInput');
      const demoMount = document.getElementById('demoMount');
      const copyStatus = document.getElementById('copyStatus');
      const fullCodeOutput = document.getElementById('fullCodeOutput');
      const copyButtons = [...document.querySelectorAll('[data-copy]')];

      const normalizeClassName = (value) => {
        const normalized = String(value || '')
          .trim()
          .replace(/[^a-zA-Z0-9_-]+/g, '-')
          .replace(/^-+|-+$/g, '');
        return normalized || 'uni-photo-dropbox';
      };

      const escapeHtml = (value) => String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;');

      const getCopyTexts = () => ({
        title: escapeHtml(uploadTitleInput.value),
        guide: escapeHtml(uploadGuideInput.value),
        meta: escapeHtml(uploadMetaInput.value)
      });

      const getElementHtml = (base) => {
        const texts = getCopyTexts();
        return `<div class="${base}">
  <label class="${base}__zone">
    <span class="${base}__inner">
      <span class="${base}__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
          <rect x="3" y="5" width="18" height="14" rx="3"></rect>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </span>
      <span class="${base}__copy">
        <span class="${base}__title">${texts.title}</span>
        <span class="${base}__guide">${texts.guide}</span>
        <span class="${base}__meta">${texts.meta}</span>
      </span>
    </span>
    <input class="${base}__input" type="file" accept="image/*">
  </label>
  <div class="${base}__preview-wrap">
    <img class="${base}__preview" alt="アップロードした写真のプレビュー">
    <span class="${base}__change">写真を入れ替える</span>
  </div>
</div>`;
      };

      const getCss = (base) => `@layer ${base} {
  .${base} {
    padding: 20px;
    background: rgba(255, 255, 255, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 24px;
    box-shadow: 0 8px 24px rgba(41, 50, 75, 0.07);
  }

  .${base}__zone {
    position: relative;
    display: grid;
    place-items: center;
    width: 100%;
    height: 220px;
    overflow: hidden;
    border: 1.5px dashed rgba(117, 103, 220, 0.28);
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,247,253,0.98));
    cursor: pointer;
    box-sizing: border-box;
    transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }

  .${base}__zone:hover,
  .${base}__zone.is-dragging {
    border-color: rgba(117, 103, 220, 0.58);
    box-shadow: 0 12px 28px rgba(117, 103, 220, 0.10);
    transform: translateY(-1px);
  }

  .${base}__inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 22px;
    text-align: center;
    pointer-events: none;
  }

  .${base}__icon {
    display: grid;
    place-items: center;
    width: 54px;
    height: 54px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(117,103,220,0.12), rgba(217,137,180,0.16));
  }

  .${base}__icon svg {
    width: 25px;
    height: 25px;
    stroke: #6e65ad;
  }

  .${base}__copy {
    display: grid;
    gap: 5px;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
  }

  .${base}__title {
    color: #182033;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.35;
    letter-spacing: .01em;
  }

  .${base}__guide {
    color: #667085;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.55;
  }

  .${base}__meta {
    color: #98a2b3;
    font-size: 11px;
    font-weight: 500;
    line-height: 1.4;
  }

  .${base}__input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }

  .${base}__preview-wrap {
    position: relative;
    display: none;
  }

  .${base}__preview-wrap.is-visible {
    display: block;
  }

  .${base}__preview {
    display: block;
    width: 100%;
    max-height: 420px;
    object-fit: contain;
    border: 1px solid rgba(110, 145, 210, 0.16);
    border-radius: 18px;
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
  }

  .${base}__change {
    position: absolute;
    right: 12px;
    bottom: 12px;
    padding: 8px 12px;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(34,46,66,.84), rgba(56,69,92,.90));
    color: #fff;
    font: 700 12px/1 system-ui, sans-serif;
    box-shadow: 0 6px 16px rgba(15,23,42,.18);
    pointer-events: none;
  }

  @media (max-width: 540px) {
    .${base} { padding: 16px; }
    .${base}__zone { height: 190px; }
  }
}`;

      const getJs = (base) => `document.querySelectorAll('.${base}').forEach((root) => {
  const zone = root.querySelector('.${base}__zone');
  const input = root.querySelector('.${base}__input');
  const previewWrap = root.querySelector('.${base}__preview-wrap');
  const preview = root.querySelector('.${base}__preview');

  const showImage = (file) => {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = () => {
      preview.src = reader.result;
      zone.style.display = 'none';
      previewWrap.classList.add('is-visible');
    };
    reader.readAsDataURL(file);
  };

  input.addEventListener('change', () => showImage(input.files[0]));
  previewWrap.addEventListener('click', () => input.click());

  ['dragenter', 'dragover'].forEach((type) => {
    zone.addEventListener(type, (event) => {
      event.preventDefault();
      zone.classList.add('is-dragging');
    });
  });

  ['dragleave', 'drop'].forEach((type) => {
    zone.addEventListener(type, (event) => {
      event.preventDefault();
      zone.classList.remove('is-dragging');
    });
  });

  zone.addEventListener('drop', (event) => showImage(event.dataTransfer.files[0]));
});`;

      const getLazyHtml = (base) => {
        const texts = getCopyTexts();
        const id = `${base}-${Math.random().toString(36).slice(2, 8)}`;
        const style = 'position:relative;display:grid;place-items:center;width:100%;height:220px;overflow:hidden;border:1.5px dashed rgba(117,103,220,.28);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(248,247,253,.98));cursor:pointer;box-sizing:border-box;transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease';
        return `<div id="${id}" style="padding:20px;background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:0 8px 24px rgba(41,50,75,.07);box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP','Hiragino Sans','Meiryo',sans-serif;color:#0f172a;line-height:1.6"><label style="${style}" onmouseenter="this.style.borderColor='rgba(117,103,220,.58)';this.style.boxShadow='0 12px 28px rgba(117,103,220,.10)';this.style.transform='translateY(-1px)'" onmouseleave="this.style.borderColor='rgba(117,103,220,.28)';this.style.boxShadow='none';this.style.transform='none'" ondragover="event.preventDefault();this.style.borderColor='rgba(117,103,220,.58)';this.style.boxShadow='0 12px 28px rgba(117,103,220,.10)';this.style.transform='translateY(-1px)'" ondragleave="this.style.borderColor='rgba(117,103,220,.28)';this.style.boxShadow='none';this.style.transform='none'" ondrop="event.preventDefault();this.style.borderColor='rgba(117,103,220,.28)';this.style.boxShadow='none';this.style.transform='none';const f=event.dataTransfer.files[0];if(f&&f.type.startsWith('image/')){const r=new FileReader();r.onload=()=>{this.style.display='none';const w=this.nextElementSibling;w.style.display='block';w.querySelector('img').src=r.result};r.readAsDataURL(f)}"><span style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px;text-align:center;pointer-events:none"><span style="display:grid;place-items:center;width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,rgba(117,103,220,.12),rgba(217,137,180,.16))"><svg viewBox="0 0 24 24" fill="none" stroke="#6e65ad" stroke-width="2" style="width:25px;height:25px"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="12" cy="12" r="3"></circle></svg></span><span style="display:grid;gap:5px;margin:0;text-align:center"><span style="color:#182033;font-size:16px;font-weight:800;line-height:1.35;letter-spacing:.01em">${texts.title}</span><span style="color:#667085;font-size:13px;font-weight:600;line-height:1.55">${texts.guide}</span><span style="color:#98a2b3;font-size:11px;font-weight:500;line-height:1.4">${texts.meta}</span></span></span><input type="file" accept="image/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer" onchange="const f=this.files[0];if(f&&f.type.startsWith('image/')){const r=new FileReader();r.onload=()=>{this.parentElement.style.display='none';const w=this.parentElement.nextElementSibling;w.style.display='block';w.querySelector('img').src=r.result};r.readAsDataURL(f)}"></label><div style="position:relative;display:none;overflow:hidden;border-radius:18px;cursor:pointer" onclick="this.previousElementSibling.querySelector('input').click()"><img alt="アップロードした写真のプレビュー" style="display:block;width:100%;max-height:420px;object-fit:contain;background:#f8fafc;border:1px solid rgba(110,145,210,.16);border-radius:18px;box-shadow:0 8px 20px rgba(15,23,42,.08);box-sizing:border-box"><span style="position:absolute;right:12px;bottom:12px;padding:8px 12px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:linear-gradient(180deg,rgba(34,46,66,.84),rgba(56,69,92,.9));color:#fff;font-size:12px;font-weight:700;line-height:1;box-shadow:0 6px 16px rgba(15,23,42,.18);pointer-events:none">写真を入れ替える</span></div></div>`;
      };


      const getFullCode = (base) => `<style>
${getCss(base)}
</style>

${getElementHtml(base)}

<script>
${getJs(base)}
<\/script>`;

      const updateFullCode = () => {
        const base = normalizeClassName(classInput.value);
        fullCodeOutput.value = getFullCode(base);
      };

      const mountDemo = () => {
        demoMount.innerHTML = `
          <div class="photo-upload-card">
            <label class="photo-upload-zone" id="demoZone">
              <span class="photo-upload-inner">
                <span class="photo-upload-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                    <rect x="3" y="5" width="18" height="14" rx="3"></rect>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </span>
                <span class="photo-upload-copy">
                  <span class="photo-upload-title">${escapeHtml(uploadTitleInput.value)}</span>
                  <span class="photo-upload-guide">${escapeHtml(uploadGuideInput.value)}</span>
                  <span class="photo-upload-meta">${escapeHtml(uploadMetaInput.value)}</span>
                </span>
              </span>
              <input id="demoInput" class="photo-upload-input" type="file" accept="image/*">
            </label>
            <div id="demoPreviewWrap" class="photo-upload-preview-wrap">
              <img id="demoPreview" class="photo-upload-preview" alt="アップロードした写真のプレビュー">
              <span class="photo-upload-change">写真を入れ替える</span>
            </div>
          </div>`;

        const zone = document.getElementById('demoZone');
        const input = document.getElementById('demoInput');
        const previewWrap = document.getElementById('demoPreviewWrap');
        const preview = document.getElementById('demoPreview');
        let selectedFile = null;

        const showImage = (file) => {
          if (!file || !file.type.startsWith('image/')) return;
          
          selectedFile = file;
          
          const reader = new FileReader();
          reader.onload = () => {
            preview.src = reader.result;
            zone.style.display = 'none';
            previewWrap.classList.add('is-visible');
          };
          reader.readAsDataURL(file);
        };

        input.addEventListener('change', () => showImage(input.files[0]));
        previewWrap.addEventListener('click', () => input.click());
        ['dragenter', 'dragover'].forEach((type) => zone.addEventListener(type, (event) => {
          event.preventDefault();
          zone.classList.add('is-dragging');
        }));
        ['dragleave', 'drop'].forEach((type) => zone.addEventListener(type, (event) => {
          event.preventDefault();
          zone.classList.remove('is-dragging');
        }));
        zone.addEventListener('drop', (event) => showImage(event.dataTransfer.files[0]));
      };

      const DB_NAME = 'photo-upload-element-settings';
      const STORE_NAME = 'settings';

      const openSettingsDb = () => new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains(STORE_NAME)) {
            request.result.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });

      const saveTextSettings = async () => {
        try {
          const db = await openSettingsDb();
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put({
            title: uploadTitleInput.value,
            guide: uploadGuideInput.value,
            meta: uploadMetaInput.value
          }, 'upload-copy');
          tx.oncomplete = () => db.close();
          tx.onerror = () => db.close();
        } catch (_) {
          // IndexedDBを利用できない環境では画面内の反映のみ継続します。
        }
      };

      const loadTextSettings = async () => {
        try {
          const db = await openSettingsDb();
          const value = await new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const request = tx.objectStore(STORE_NAME).get('upload-copy');
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
            tx.oncomplete = () => db.close();
          });
          if (value) {
            uploadTitleInput.value = value.title ?? uploadTitleInput.value;
            uploadGuideInput.value = value.guide ?? uploadGuideInput.value;
            uploadMetaInput.value = value.meta ?? uploadMetaInput.value;
          }
        } catch (_) {
          // 読み込みに失敗しても初期値で動作します。
        }
      };

      const refreshTextOutputs = () => {
        const title = document.querySelector('.photo-upload-title');
        const guide = document.querySelector('.photo-upload-guide');
        const meta = document.querySelector('.photo-upload-meta');
        if (title) title.textContent = uploadTitleInput.value;
        if (guide) guide.textContent = uploadGuideInput.value;
        if (meta) meta.textContent = uploadMetaInput.value;
        updateFullCode();
      };

      const writeClipboard = async (text) => {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        const ok = document.execCommand('copy');
        textarea.remove();
        if (!ok) throw new Error('コピーできませんでした。');
      };

      copyButtons.forEach((button) => {
        button.addEventListener('click', async () => {
          const base = normalizeClassName(classInput.value);
          classInput.value = base;
          const type = button.dataset.copy;
          const map = {
            css: getCss(base),
            html: getElementHtml(base),
            js: getJs(base),
            lazy: getLazyHtml(base)
          };
          try {
            await writeClipboard(map[type]);
            copyButtons.forEach((item) => item.classList.remove('is-done'));
            button.classList.add('is-done');
            const label = button.textContent.replace('をコピー', '');
            copyStatus.textContent = `${label}をコピーしました。`;
            window.setTimeout(() => button.classList.remove('is-done'), 1400);
          } catch (error) {
            copyStatus.textContent = error.message || 'コピーに失敗しました。';
          }
        });
      });

      classInput.addEventListener('input', updateFullCode);
      [uploadTitleInput, uploadGuideInput, uploadMetaInput].forEach((input) => {
        input.addEventListener('input', () => {
          refreshTextOutputs();
          saveTextSettings();
        });
      });
      classInput.addEventListener('blur', () => {
        classInput.value = normalizeClassName(classInput.value);
        updateFullCode();
      });

      mountDemo();
      updateFullCode();
      loadTextSettings().then(refreshTextOutputs);
    })();
  </script>
</body>
</html>
