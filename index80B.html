<script>
const version=24;
const D='index80B',S='pages',K=D+'-content-v'+version,B='./index80BBody.html';
const clearVersionFragment=()=>{const p=new URLSearchParams(location.hash.slice(1));p.delete('ver');const h=p.toString();history.replaceState(null,'',location.pathname+location.search+(h?'#'+h:''))};
const goBody=()=>{const u=new URL(B,location.href);u.search=location.search;u.hash='ver='+version;location.replace(u.href)};
if(!('indexedDB'in window))goBody();
else{const r=indexedDB.open(D,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(S))r.result.createObjectStore(S)};r.onerror=()=>goBody();r.onsuccess=()=>{const d=r.result,q=d.transaction(S).objectStore(S).get(K);q.onerror=()=>{d.close();goBody()};q.onsuccess=()=>{const h=q.result?.html;d.close();h?(document.open(),document.write(h),document.close(),clearVersionFragment()):goBody()}}}
</script>
