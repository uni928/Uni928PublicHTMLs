<script>(() => {
  "use strict";

  const payloadNode = document.getElementById("__encrypted_payload__");
  const bootScript = document.currentScript;

  function fail(message) {
    document.body.innerHTML = '<main style="max-width:720px;margin:60px auto;padding:24px;font-family:system-ui,sans-serif;line-height:1.7"><h1>復号できませんでした</h1><p>' + String(message).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) + '</p></main>';
  }

  function b64(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function hash(value) {
    return new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(value.replace(/\r\n?/g, "\n"))));
  }

  async function decrypt(cipherBytes, ivBytes, rawKeyBytes) {
    const key = await crypto.subtle.importKey("raw", rawKeyBytes, { name: "AES-GCM" }, false, ["decrypt"]);
    return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: ivBytes }, key, cipherBytes));
  }

  (async () => {
    if (!payloadNode) throw new Error("暗号データが見つかりません。");

    const cipher = payloadNode.textContent.trim();
    const cipherIv = payloadNode.dataset.cipherIv || "";
    const wrappedKey = payloadNode.dataset.wrappedKey || "";
    const wrappedIv = payloadNode.dataset.wrappedIv || "";
    const shellHash = payloadNode.dataset.shellHash || "";
    const shellSource = payloadNode.dataset.shellSource || "";

    payloadNode.remove();

    if (!shellSource) throw new Error("外枠の検証情報が見つかりません。");
    const canonicalShellBytes = b64(shellSource);
    const canonicalShell = new TextDecoder().decode(canonicalShellBytes);
    canonicalShellBytes.fill(0);

    const currentHash = btoa(String.fromCharCode(...await hash(canonicalShell)));
    if (currentHash !== shellHash) throw new Error("生成HTMLの検証情報が一致しません。");
    bootScript?.remove();

    const wrappingKey = await hash(shellHash);
    const rawLongKey = await decrypt(b64(wrappedKey), b64(wrappedIv), wrappingKey);
    const contentKey = await crypto.subtle.digest("SHA-256", rawLongKey);
    const plain = await decrypt(b64(cipher), b64(cipherIv), new Uint8Array(contentKey));
    const htmlBase64 = new TextDecoder().decode(plain);
    const htmlBytes = b64(htmlBase64);
    const html = new TextDecoder().decode(htmlBytes);

    rawLongKey.fill(0);
    plain.fill(0);
    htmlBytes.fill(0);

    // 非同期処理後の document.write() は、環境によって現在の文書へ追記されることがあります。
    // 復号HTMLをBlob文書として同一タブへ遷移し、ローダー文書を完全に破棄します。
    const currentBase = new URL(".", location.href).href;
    let navigableHtml = html;

    if (!/<base\s/i.test(navigableHtml)) {
      const baseTag = '<base href="' + currentBase.replace(/&/g, "&amp;").replace(/"/g, "&quot;") + '">';
      if (/<head(?:\s[^>]*)?>/i.test(navigableHtml)) {
        navigableHtml = navigableHtml.replace(/<head(?:\s[^>]*)?>/i, match => match + baseTag);
      } else if (/<html(?:\s[^>]*)?>/i.test(navigableHtml)) {
        navigableHtml = navigableHtml.replace(/<html(?:\s[^>]*)?>/i, match => match + '<head>' + baseTag + '</head>');
      } else {
        navigableHtml = '<!DOCTYPE html><html><head>' + baseTag + '</head><body>' + navigableHtml + '</aaabody></aaahtml>'.replace("aaa", "");
      }
    }

    const restoredBlob = new Blob([navigableHtml], { type: "text/html;charset=utf-8" });
    const restoredUrl = URL.createObjectURL(restoredBlob);
    location.replace(restoredUrl);
  })().catch(error => fail(error && error.message ? error.message : error));
})();</script>
